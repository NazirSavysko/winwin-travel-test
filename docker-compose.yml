services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=winwin_db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d winwin_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - win-win

  auth-api:
    build: ./auth-api
    container_name: auth-api
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/winwin_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - INTERNAL_TOKEN=SomeSuperSecretInternalToken
      - JWT_SECRET=z8pWp3S3fR7kMvN2xQ5yL9tB1aC4dE6g
      - JWT_EXPIRATION=36000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - win-win

  data-api:
    build: ./data-api
    container_name: data-api
    ports:
      - "8081:8081"
    environment:
      - INTERNAL_TOKEN=SomeSuperSecretInternalToken
    networks:
      - win-win

networks:
  win-win:
    driver: bridge